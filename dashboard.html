<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2F5D8A">
  <title>Dashboard — Daily Consultant Reports</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/card.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
  <script type="module" src="js/dashboard/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span data-i18n="app.name">Daily Consultant Reports</span></div>
    <button type="button" class="lang-toggle" id="langToggle"></button>
    <button type="button" class="btn sm" id="logoutBtn" data-i18n="auth.logout" hidden>Sign out</button>
  </header>
  <nav class="nav" id="nav" hidden>
    <a href="#today" data-route="today" data-i18n="nav.today">Today</a>
    <a href="#reports" data-route="reports" data-i18n="nav.reports">Reports</a>
    <a href="#projects" data-route="projects" data-i18n="nav.projects">Projects</a>
    <a href="#consultants" data-route="consultants" data-i18n="nav.consultants">Consultants</a>
    <a href="#storage" data-route="storage" data-i18n="nav.storage">Storage &amp; Archive</a>
    <a href="#admin" data-route="admin" data-i18n="nav.admin" hidden id="navAdmin">Admin</a>
  </nav>

  <main class="dash">
    <section id="loading" class="center-state">
      <span class="spinner"></span>
      <p data-i18n="common.loading">Loading…</p>
    </section>
    <script>
      setTimeout(function () {
        var l = document.getElementById('loading');
        if (l && !l.hidden && !window.__dcrBooted) {
          l.innerHTML = '<p>Could not load the page. Check your connection.<br><span lang="ar" dir="rtl">تعذّر تحميل الصفحة. تأكد من الاتصال.</span></p>' +
            '<button type="button" class="btn primary" onclick="location.reload()">Retry / إعادة المحاولة</button>';
        }
      }, 15000);
    </script>

    <section id="login" class="login" hidden>
      <form id="loginForm" class="panel" novalidate>
        <h1 data-i18n="auth.title">Dashboard sign in</h1>
        <label class="field">
          <span class="label" data-i18n="auth.email">Email</span>
          <input class="input" id="loginEmail" type="email" autocomplete="username" required dir="ltr">
        </label>
        <label class="field">
          <span class="label" data-i18n="auth.password">Password</span>
          <input class="input" id="loginPassword" type="password" autocomplete="current-password" required dir="ltr">
        </label>
        <div id="loginError" class="msg error" role="alert" hidden></div>
        <div id="loginInfo" class="msg ok" role="status" hidden></div>
        <button type="submit" class="btn primary lg block" id="loginBtn" data-i18n="auth.submit">Sign in</button>
        <p class="center-link"><button type="button" class="linkbtn" id="forgotBtn" data-i18n="auth.forgot">Forgot password?</button></p>
      </form>
    </section>

    <section id="recovery" class="login" hidden>
      <form id="recoveryForm" class="panel" novalidate>
        <h1 data-i18n="auth.newTitle">Set a new password</h1>
        <label class="field">
          <span class="label" data-i18n="auth.newPassword">New password</span>
          <input class="input" id="newPassword" type="password" autocomplete="new-password" minlength="8" required dir="ltr">
          <span class="hint" data-i18n="auth.newHint"></span>
        </label>
        <label class="field">
          <span class="label" data-i18n="auth.newPassword2">Repeat the new password</span>
          <input class="input" id="newPassword2" type="password" autocomplete="new-password" minlength="8" required dir="ltr">
        </label>
        <div id="recoveryError" class="msg error" role="alert" hidden></div>
        <button type="submit" class="btn primary lg block" id="recoveryBtn" data-i18n="auth.newSave">Save password</button>
      </form>
    </section>

    <section id="view" hidden></section>
  </main>

  <dialog id="lightbox" class="lightbox">
    <button type="button" class="lightbox-close" data-i18n-aria="common.close" aria-label="Close">×</button>
    <img alt="">
  </dialog>
</body>
</html>
